services:
  # Tor SOCKS5 Proxy Service
  torproxy:
    image: dperson/torproxy
    container_name: leakrecon_tor
    environment:
      - TOR_EXTRA_ARGS=--SocksPort 0.0.0.0:9050
    ports:
      - "9050:9050"
    restart: unless-stopped
    networks:
      - leakrecon_net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9050"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # LeakRecon Application Service
  leakrecon:
    build: .
    container_name: leakrecon_app
    depends_on:
      torproxy:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TOR_PROXY_HOST=torproxy
      - TOR_PROXY_PORT=9050
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    stdin_open: true
    tty: true
    networks:
      - leakrecon_net

networks:
  leakrecon_net:
    driver: bridge
